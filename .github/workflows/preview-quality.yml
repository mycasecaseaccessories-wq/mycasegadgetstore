name: Preview quality checks

on:
  push:
    branches:
      - preorder-feature
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); for (const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(name + ' | ' + v.severity + ' | direct=' + v.isDirect + ' | fix=' + JSON.stringify(v.fixAvailable));"
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
